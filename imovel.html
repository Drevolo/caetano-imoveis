<body>

  <!--HEADER_TEMPLATE-->

  <!-- ===== DETALHE DO IMÓVEL ===== -->
  <main class="pd-page" id="property-detail">
    <div class="container pd-hero"><div class="skeleton skeleton-detail-hero"></div></div>
    <div class="container pd-grid">
      <div class="pd-main">
        <div class="skeleton skeleton-detail-price"></div>
        <div class="skeleton skeleton-detail-title"></div>
        <div class="skeleton skeleton-detail-location"></div>
        <div class="skeleton-detail-amenities"><div class="skeleton skeleton-detail-amenity"></div><div class="skeleton skeleton-detail-amenity"></div><div class="skeleton skeleton-detail-amenity"></div><div class="skeleton skeleton-detail-amenity"></div></div>
        <div class="skeleton-detail-box"><div class="skeleton skeleton-text h28 w60"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text w80"></div><div class="skeleton skeleton-text"></div></div>
      </div>
      <aside class="pd-side"><div class="skeleton-detail-box"><div class="skeleton skeleton-text h28 w80"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text w60"></div></div></aside>
    </div>
  </main>

  <!-- ===== IMÓVEIS RELACIONADOS ===== -->
  <section class="pd-related">
    <div class="container">
      <div class="section-head">
        <div>
          <span class="section-tag">Outros imóveis</span>
          <h2>Imóveis relacionados</h2>
        </div>
        <a href="index.html#imoveis" class="btn btn-reset">Ver todos</a>
      </div>
      <div class="listings-grid grid grid-cols-1 gap-4 md:grid-cols-2 md:gap-6 lg:grid-cols-3" id="pd-related"></div>
    </div>
  </section>

  <!-- ===== CONTATO CTA ===== -->
  <section class="financie" id="contato-cta">
    <div class="container financie-grid grid grid-cols-1 gap-8 lg:grid-cols-[1.1fr_1fr] lg:gap-12">
      <div class="financie-content">
        <span class="section-tag">Atendimento</span>
        <h2>Fale com a <span>Caetano Imóveis</span></h2>
        <p>
          Atendimento humanizado e consultoria especializada para você comprar, vender ou alugar com
          tranquilidade. Estamos prontos para atender você de segunda a sexta, das 07:30 às 17:00.
        </p>
        <a href="index.html#contato" class="btn btn-gold"><i class="fa-solid fa-phone"></i> Fale com a gente</a>
      </div>
      <div class="financie-media">
        <img src="https://caetanoimoveis.com.br/wp-content/uploads/2025/08/Sem-titulo-1-2.jpg" alt="Caetano Imóveis" onerror="this.style.display='none'" />
      </div>
    </div>
  </section>

  <!--FOOTER_TEMPLATE-->

  <!-- ===== WHATSAPP FLUTUANTE ===== -->
  <a href="https://api.whatsapp.com/send/?phone=5562985070819&text=Ol%C3%A1%21%20Gostaria%20de%20mais%20informa%C3%A7%C3%B5es%20sobre%20os%20im%C3%B3veis." class="whatsapp-float" target="_blank" aria-label="Fale conosco no WhatsApp">
    <i class="fa-brands fa-whatsapp"></i>
  </a>

  <!-- ===== MODAL FAVORITOS ===== -->
  <div class="modal" id="fav-modal" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-content modal-fav" role="dialog" aria-modal="true">
      <button class="modal-close" data-close-modal aria-label="Fechar"><i class="fa-solid fa-xmark"></i></button>
      <div class="modal-body" id="fav-modal-body"></div>
    </div>
  </div>

  <script defer src="js/config.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="js/favoritos.js"></script>
  <script defer src="js/imoveis.js"></script>
  <script defer src="js/imoveis-api.js"></script>
  <script defer src="js/cards.js"></script>
